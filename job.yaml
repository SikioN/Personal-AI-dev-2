name: personal-ai-telegram-bot
desc: KG QA Navigator — Telegram Bot (in-memory + DeepSeek)

cmd: >
  pip install -r requirements.txt -q &&
  python bot.py

env:
  vars:
    - name: TELEGRAM_BOT_TOKEN
      value: "8614082912:AAGxII40bn9XU5kQh1sck8Nu-0Dz-cVah6s"
    - name: LLM_BACKEND
      value: "deepseek"
    - name: DEEPSEEK_API_KEY
      value: "REPLACE_WITH_YOUR_DEEPSEEK_KEY"
    - name: MODEL_PATH
      value: "/home/jupyter/mnt/REPLACE_BUCKET/models/wikidata_finetuned"
    - name: KG_DATA_PATH
      value: "/home/jupyter/mnt/REPLACE_BUCKET/wikidata_big/kg"
    - name: CHROMA_NODES_PATH
      value: "/tmp/chroma_nodes"
    - name: CHROMA_QUADS_PATH
      value: "/tmp/chroma_quads"

cloud-instance-types:
  - c1.4
